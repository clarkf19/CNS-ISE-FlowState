# Secure Network Gateway configuration.
# Relative paths are resolved against this file's directory.

host = "127.0.0.1"
port = 9000
backend_host = "127.0.0.1"
backend_port = 9100

session_ttl_s = 300            # session lifetime (EXPIRED_SESSION after this)
max_skew_ms = 30000            # timestamp freshness window (STALE_REQUEST outside it)
nonce_cache_size = 4096        # per-session nonce cache bound
max_requests_per_session = 1000000

registry_path = "../keys/clients.json"     # generated by `flowstate-keys bootstrap`
policy_path = "policy.toml"
gateway_key_path = "../keys/gateway.key"
backend_token_path = "../keys/backend.token"
audit_log_path = "../logs/audit.jsonl"
