name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit, integration and attack-regression tests
        run: pytest
      - name: Attack simulation suite
        run: python -m attacks.runner
      - name: Evaluation smoke run
        run: python -m eval.benchmark --requests 50 --no-write
