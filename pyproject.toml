[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowstate-gateway"
version = "1.0.0"
description = "Secure Network Gateway against MITM, replay and session attacks (ACNS-DC 2026-27, Team FlowState)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
flowstate-keys = "flowstate.identity.cli:main"
flowstate-gateway = "flowstate.gateway.__main__:main"
flowstate-backend = "flowstate.backend.__main__:main"
flowstate-client = "flowstate.client.cli:main"
flowstate-audit = "flowstate.audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
